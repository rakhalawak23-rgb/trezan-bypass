    <script>
        const SUPABASE_URL = 'https://czearfmiqddnqtailckb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_cB9eiLcaI4vtGK6E7NaxRQ_w3lIRTbb';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 
        let cachedTools = [];
        let cachedApks = [];
        let currentTab = 'tools';
        let currentApkUrl = '';
        let currentApkTitle = '';
        let currentActiveTool = null;
        let isDownloading = false;
 
        document.addEventListener("DOMContentLoaded", () => {
            loadInitialData();
        });
 
        /* MENU TOGGLE FUNCTION */
        function toggleNavMenu() {
            const drawer = document.getElementById('navMenuDrawer');
            const overlay = document.getElementById('navMenuOverlay');
            
            if (drawer.classList.contains('translate-x-full')) {
                drawer.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                drawer.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }
 
        /* TERMUX ANIMATION LOG SYSTEM */
        function appendMainTermuxLog(text, isOverwrite = false) {
            const container = document.getElementById('mainTermuxLogs');
            if (!container) return;
            if (isOverwrite && container.lastElementChild) {
                container.lastElementChild.innerHTML = text;
            } else {
                const line = document.createElement('div');
                line.innerHTML = text;
                container.appendChild(line);
            }
            const parent = container.parentElement;
            if (parent) parent.scrollTop = parent.scrollHeight;
        }
 
        function appendIframeTermuxLog(text, isOverwrite = false) {
            const container = document.getElementById('iframeTermuxLogs');
            if (!container) return;
            if (isOverwrite && container.lastElementChild) {
                container.lastElementChild.innerHTML = text;
            } else {
                const line = document.createElement('div');
                line.innerHTML = text;
                container.appendChild(line);
            }
            const parent = container.parentElement;
            if (parent) parent.scrollTop = parent.scrollHeight;
        }
 
        async function showLoadingTermux(typeText) {
            document.getElementById('mainLoadingOverlay').classList.remove('hidden');
            document.getElementById('sectionTools').classList.add('hidden');
            document.getElementById('sectionApk').classList.add('hidden');
            
            const container = document.getElementById('mainTermuxLogs');
            container.innerHTML = '';
 
            appendMainTermuxLog(`<span class="text-yellow-400">[INFO]</span> MEMUAT ${typeText.toUpperCase()}...`);
            await new Promise(r => setTimeout(r, 150));
 
            appendMainTermuxLog(`<span class="text-yellow-400">[INFO]</span> MENYIAPKAN DATA BASE...`);
            await new Promise(r => setTimeout(r, 150));
 
            for (let i = 10; i <= 90; i += 20) {
                appendMainTermuxLog(`<span class="text-cyan-400">[PROGRESS]</span> SEDANG MENGAMBIL DATA: ${i}%`, i > 10);
                await new Promise(r => setTimeout(r, 50));
            }
        }
 
        function hideLoading() {
            appendMainTermuxLog(`<span class="text-green-400">[PROGRESS]</span> SEDANG MENGAMBIL DATA: 100%`, true);
            appendMainTermuxLog(`<span class="text-green-400 font-bold">[SUCCESS]</span> BERHASIL MEMUAT DATA!`);
            setTimeout(() => {
                document.getElementById('mainLoadingOverlay').classList.add('hidden');
            }, 250);
        }
 
        async function loadInitialData() {
            await showLoadingTermux("Tools");
            await fetchTools();
            await fetchApks();
            hideLoading();
            showSection('tools');
        }
 
        function showSection(tab) {
            if (tab === 'tools') {
                document.getElementById('sectionTools').classList.remove('hidden');
                document.getElementById('sectionApk').classList.add('hidden');
            } else {
                document.getElementById('sectionTools').classList.add('hidden');
                document.getElementById('sectionApk').classList.remove('hidden');
            }
        }
 
        async function switchMainTab(tab) {
            if (currentTab === tab) return;
            currentTab = tab;
 
            const mainTitle = document.getElementById('mainTitle');
            const btnTools = document.getElementById('mainTabToolsBtn');
            const btnApk = document.getElementById('mainTabApkBtn');
 
            if (tab === 'tools') {
                mainTitle.innerText = "Semua Tools";
                btnTools.className = "nb-button bg-cyan-400 px-4 py-2 text-sm uppercase";
                btnApk.className = "nb-button bg-gray-200 px-4 py-2 text-sm uppercase";
                await showLoadingTermux("Tools");
                await fetchTools();
                hideLoading();
                showSection('tools');
            } else {
                mainTitle.innerText = "Semua APK";
                btnTools.className = "nb-button bg-gray-200 px-4 py-2 text-sm uppercase";
                btnApk.className = "nb-button bg-green-400 px-4 py-2 text-sm uppercase";
                await showLoadingTermux("APK");
                await fetchApks();
                hideLoading();
                showSection('apk');
            }
        }
 
        async function fetchTools() {
            const { data } = await supabaseClient.from('tools').select('*').order('id', { ascending: false });
            cachedTools = data || [];
            renderToolsGrid();
        }
 
        async function fetchApks() {
            const { data } = await supabaseClient.from('apks').select('*').order('id', { ascending: false });
            cachedApks = data || [];
            renderApksGrid();
        }
 
        function renderToolsGrid() {
            const grid = document.getElementById('toolsGrid');
            const noText = document.getElementById('noToolsText');
            grid.innerHTML = '';
 
            if (cachedTools.length === 0) {
                noText.classList.remove('hidden');
                return;
            }
            noText.classList.add('hidden');
 
            cachedTools.forEach(tool => {
                const card = document.createElement('div');
                card.className = "nb-card item-card bg-white p-3 flex flex-col justify-between cursor-pointer";
                card.setAttribute('data-name', tool.name.toLowerCase());
                card.onclick = () => openPreviewTool(tool);
 
                const fitStyle = tool.image_fit || 'cover';
                const heightStyle = tool.image_height ? `${tool.image_height}px` : '128px';
                const radiusStyle = tool.image_radius ? `${tool.image_radius}px` : '0px';
                const posX = tool.image_pos_x !== undefined ? tool.image_pos_x : 50;
                const posY = tool.image_pos_y !== undefined ? tool.image_pos_y : 50;
                const zoom = tool.image_zoom ? tool.image_zoom / 100 : 1;
 
                card.innerHTML = `
                    <div style="height: ${heightStyle}; border-radius: ${radiusStyle};" class="bg-gray-100 border-2 border-black overflow-hidden mb-3 flex items-center justify-center relative w-full">
                        <img src="${tool.image_url}" class="absolute w-full h-full" style="object-fit:${fitStyle}; object-position:${posX}% ${posY}%; transform: scale(${zoom});" onerror="this.onerror=null;this.src='https://via.placeholder.com/150';">
                    </div>
                    <div class="flex-grow flex flex-col justify-between">
                        <h2 class="text-base font-black uppercase leading-tight line-clamp-2">${tool.name}</h2>
                        <span class="mt-2 inline-block bg-cyan-300 border-2 border-black text-[10px] font-bold px-1.5 py-0.5 text-center uppercase">Buka Tool</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
 
        function renderApksGrid() {
            const grid = document.getElementById('apkGrid');
            const noText = document.getElementById('noApkText');
            grid.innerHTML = '';
 
            if (cachedApks.length === 0) {
                noText.classList.remove('hidden');
                return;
            }
            noText.classList.add('hidden');
 
            cachedApks.forEach(apk => {
                const card = document.createElement('div');
                card.className = "nb-card item-card bg-white p-3 flex flex-col justify-between cursor-pointer";
                card.setAttribute('data-name', apk.title.toLowerCase());
                card.onclick = () => openPreviewApk(apk);
 
                const fitStyle = apk.image_fit || 'cover';
                const heightStyle = apk.image_height ? `${apk.image_height}px` : '128px';
                const radiusStyle = apk.image_radius ? `${apk.image_radius}px` : '0px';
                const posX = apk.image_pos_x !== undefined ? apk.image_pos_x : 50;
                const posY = apk.image_pos_y !== undefined ? apk.image_pos_y : 50;
                const zoom = apk.image_zoom ? apk.image_zoom / 100 : 1;
 
                card.innerHTML = `
                    <div style="height: ${heightStyle}; border-radius: ${radiusStyle};" class="bg-gray-100 border-2 border-black overflow-hidden mb-3 flex items-center justify-center relative w-full">
                        <img src="${apk.image_url}" class="absolute w-full h-full" style="object-fit:${fitStyle}; object-position:${posX}% ${posY}%; transform: scale(${zoom});" onerror="this.onerror=null;this.src='https://via.placeholder.com/150';">
                    </div>
                    <div class="flex-grow flex flex-col justify-between">
                        <h2 class="text-base font-black uppercase leading-tight line-clamp-2">${apk.title}</h2>
                        <span class="mt-2 inline-block bg-green-400 border-2 border-black text-[10px] font-bold px-1.5 py-0.5 text-center uppercase">Buka APK</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
 
        async function openPreviewTool(tool) {
            currentActiveTool = tool;
            document.getElementById('previewToolTitle').innerText = tool.name;
            document.getElementById('apkCardPreviewContainer').classList.add('hidden');
            
            const iframeContainer = document.getElementById('iframeContainer');
            iframeContainer.classList.remove('hidden');
            
            const iframeLoading = document.getElementById('iframeLoading');
            iframeLoading.classList.remove('hidden');
 
            const iframeLogs = document.getElementById('iframeTermuxLogs');
            iframeLogs.innerHTML = '';
 
            appendIframeTermuxLog('<span class="text-yellow-400">[INFO]</span> MEMUAT TOOL...');
            await new Promise(r => setTimeout(r, 150));
 
            appendIframeTermuxLog('<span class="text-yellow-400">[INFO]</span> MENYIAPKAN TAMPILAN...');
            await new Promise(r => setTimeout(r, 150));
 
            for (let i = 20; i <= 80; i += 30) {
                appendIframeTermuxLog(`<span class="text-cyan-400">[PROGRESS]</span> SEDANG MEMPROSES: ${i}%`, i > 20);
                await new Promise(r => setTimeout(r, 80));
            }
 
            const iframe = document.getElementById('previewIframe');
 
            if (tool.content_type === 'ide' && tool.files_json && tool.files_json.length > 0) {
                let files = tool.files_json;
                let indexHtml = files.find(f => f.path === 'index.html') || files[0];
                let compiledCode = indexHtml ? indexHtml.content : '<h1>Tidak ada index.html</h1>';
 
                files.forEach(f => {
                    if (f.path.endsWith('.css')) {
                        compiledCode += `<style>\n${f.content}\n<\/style>`;
                    } else if (f.path.endsWith('.js') && f.path !== 'index.html') {
                        compiledCode += `<script>\n${f.content}\n<\/script>`;
                    }
                });
 
                iframe.removeAttribute('src');
                iframe.srcdoc = compiledCode;
            } else if (tool.content_type === 'html' && tool.html_code) {
                iframe.removeAttribute('src');
                iframe.srcdoc = tool.html_code;
            } else {
                iframe.removeAttribute('srcdoc');
                iframe.src = tool.target_url || '#';
            }
            
            document.getElementById('previewModal').classList.remove('hidden');
            document.getElementById('previewModal').classList.add('flex');
        }
 
        function openPreviewApk(apk) {
            currentActiveTool = null;
            document.getElementById('previewToolTitle').innerText = apk.title;
            document.getElementById('iframeContainer').classList.add('hidden');
            
            const apkContainer = document.getElementById('apkCardPreviewContainer');
            apkContainer.classList.remove('hidden');
 
            const img = document.getElementById('apkPreviewImg');
            img.src = apk.image_url;
            img.style.objectFit = apk.image_fit || 'cover';
            img.style.objectPosition = `${apk.image_pos_x || 50}% ${apk.image_pos_y || 50}%`;
            img.style.transform = `scale(${(apk.image_zoom || 100) / 100})`;
 
            const containerBox = document.getElementById('apkPreviewContainerBox');
            containerBox.style.height = (apk.image_height || 128) + 'px';
            containerBox.style.borderRadius = (apk.image_radius || 0) + 'px';
 
            document.getElementById('apkPreviewTitle').innerText = apk.title;
            currentApkUrl = apk.apk_url;
            currentApkTitle = apk.title;
 
            document.getElementById('termuxBox').classList.add('hidden');
            document.getElementById('termuxLogs').innerHTML = '';
            document.getElementById('downloadBtnText').innerText = "DOWNLOAD APK SEKARANG";
            document.getElementById('directDownloadBtn').disabled = false;
 
            document.getElementById('previewModal').classList.remove('hidden');
            document.getElementById('previewModal').classList.add('flex');
        }
 
        /* FUNGSI REFRESH PREVIEW */
        function refreshPreview() {
            const iframe = document.getElementById('previewIframe');
            const iframeContainer = document.getElementById('iframeContainer');
 
            if (!iframeContainer.classList.contains('hidden')) {
                if (currentActiveTool) {
                    openPreviewTool(currentActiveTool);
                } else if (iframe.src) {
                    iframe.src = iframe.src;
                }
            } else {
                document.getElementById('termuxBox').classList.add('hidden');
                document.getElementById('termuxLogs').innerHTML = '';
                document.getElementById('downloadBtnText').innerText = "DOWNLOAD APK SEKARANG";
                document.getElementById('directDownloadBtn').disabled = false;
            }
        }
 
        function appendTermuxLog(text, isOverwrite = false) {
            const logsContainer = document.getElementById('termuxLogs');
            if (isOverwrite && logsContainer.lastElementChild) {
                logsContainer.lastElementChild.innerHTML = text;
            } else {
                const line = document.createElement('div');
                line.innerHTML = text;
                logsContainer.appendChild(line);
            }
            const box = document.getElementById('termuxBox');
            box.scrollTop = box.scrollHeight;
        }
 
        async function startTermuxDownload() {
            if (isDownloading || !currentApkUrl) return;
 
            isDownloading = true;
            const btn = document.getElementById('directDownloadBtn');
            const btnText = document.getElementById('downloadBtnText');
            btn.disabled = true;
            btnText.innerText = "PROSES MENGUNDUH...";
 
            const termuxBox = document.getElementById('termuxBox');
            termuxBox.classList.remove('hidden');
            document.getElementById('termuxLogs').innerHTML = '';
 
            appendTermuxLog('<span class="text-yellow-400">[INFO]</span> MEMUAT APK...');
            await new Promise(r => setTimeout(r, 500));
 
            appendTermuxLog('<span class="text-yellow-400">[INFO]</span> MENYIAPKAN DATA APK...');
            await new Promise(r => setTimeout(r, 500));
 
            try {
                const response = await fetch(currentApkUrl);
                if (!response.ok) throw new Error('Download failed');
 
                const contentLength = response.headers.get('content-length');
                const totalBytes = contentLength ? parseInt(contentLength, 10) : 0;
                let loadedBytes = 0;
 
                const reader = response.body.getReader();
                const chunks = [];
 
                appendTermuxLog('<span class="text-cyan-400">[PROGRESS]</span> SEDANG MENGAMBIL DATA APK: 0%');
 
                let lastPercent = -1;
 
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
 
                    chunks.push(value);
                    loadedBytes += value.length;
 
                    if (totalBytes > 0) {
                        const percent = Math.floor((loadedBytes / totalBytes) * 100);
                        if (percent !== lastPercent) {
                            lastPercent = percent;
                            appendTermuxLog(`<span class="text-cyan-400">[PROGRESS]</span> SEDANG MENGAMBIL DATA APK: ${percent}%`, true);
                        }
                    } else {
                        appendTermuxLog(`<span class="text-cyan-400">[PROGRESS]</span> SEDANG MENGAMBIL DATA APK... (${Math.round(loadedBytes / 1024)} KB)`, true);
                    }
                }
 
                const blob = new Blob(chunks, { type: 'application/vnd.android.package-archive' });
                const blobUrl = window.URL.createObjectURL(blob);
 
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = (currentApkTitle || 'Aplikasi') + '.apk';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(blobUrl);
 
                appendTermuxLog('<span class="text-green-400">[SUCCESS]</span> 100%');
                appendTermuxLog('<span class="text-green-400 font-bold">[SUCCESS]</span> APK SIAP DI DOWNLOAD');
                btnText.innerText = "SELESAI!";
 
            } catch (error) {
                for (let p = 10; p <= 100; p += 10) {
                    appendTermuxLog(`<span class="text-cyan-400">[PROGRESS]</span> SEDANG DI DOWNLOAD: ${p}%`, p > 10);
                    await new Promise(r => setTimeout(r, 100));
                }
 
                window.location.href = currentApkUrl;
 
                appendTermuxLog('<span class="text-green-400 font-bold">[SUCCESS]</span> APK SIAP DI DOWNLOAD!');
                btnText.innerText = "SELESAI!";
            } finally {
                isDownloading = false;
                setTimeout(() => {
                    btn.disabled = false;
                    btnText.innerText = "DOWNLOAD APK SEKARANG";
                }, 3000);
            }
        }
 
        function onIframeLoaded() {
            appendIframeTermuxLog('<span class="text-green-400">[PROGRESS]</span> SEDANG MEMPROSES: 100%', true);
            appendIframeTermuxLog('<span class="text-green-400 font-bold">[SUCCESS]</span> TOOL BERHASIL DIMUAT!');
            setTimeout(() => {
                document.getElementById('iframeLoading').classList.add('hidden');
            }, 250);
        }
 
        function closePreview() {
            const iframe = document.getElementById('previewIframe');
            iframe.src = '';
            iframe.removeAttribute('srcdoc');
            currentActiveTool = null;
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('previewModal').classList.remove('flex');
        }
 
        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.item-card').forEach(item => {
                const name = item.getAttribute('data-name');
                item.style.display = name.includes(query) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
